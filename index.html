argin-top:15px}.toolbar{display:flex;gap:10px;margin:20px 0;flex-wrap:wrap}input,select,textarea{border:1px solid var(--line);border-radius:8px;padding:10px;background:white;color:var(--ink)}input[type=search]{flex:1;min-width:180px}textarea{width:100%;min-height:125px}label{display:block;margin:14px 0 5px;font-size:13px}label input,label select{display:block;width:100%;margin-top:5px}.empty{padding:35px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:13px}dialog{border:0;border-radius:18px;padding:28px;max-width:650px;width:94%;max-height:90vh;overflow:auto;color:var(--ink)}dialog::backdrop{background:#172e2566}.notice{background:#edf2e7;border-radius:9px;padding:14px;font-size:13px}.answer{background:#f3f6ef;padding:18px;border-radius:10px;white-space:pre-wrap}.image{max-width:100%;max-height:260px;border-radius:8px;margin-top:12px}.danger{color:#a33}#toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#233a32;color:white;border-radius:9px;padding:10px 20px;display:none}pre{white-space:pre-wrap;overflow-wrap:anywhere} @media(max-width:800px){aside{position:static;width:auto;padding:15px 20px}aside footer{display:none}nav{display:flex;margin:12px 0 0;overflow:auto;gap:4px}nav button{white-space:nowrap;padding:8px}main{margin:0;padding:25px 18px}.grid{grid-template-columns:1fr}.hero{padding:24px;display:block}.hero button{margin-top:15px}.stats{gap:8px}.stat{padding:14px}header{align-items:start;gap:12px}h1{font-size:25px}}

async function save(){

 if(activeUser?.id!==uid)return;const next=data?.payload||{items:[]};if(!Array.isArray(next.items))throw Error('云端资料格式不正确');state={items:next.items.map(normalize)};revision=Number(data?.revision||0);ready=true;status('云端已连接 · 资料已加载');render()}

async function login(e){e.preventDefault();const email=new FormData(e.target).get('email').trim();const button=e.target.querySelector('button');button.disabled=true;status('正在发送登录邮件…');try{const {error}=await db.auth.signInWithOtp({email,options:{emailRedirectTo:'https://wjaskon.github.io/linuc-study/'}});if(error)throw error;status('登录链接已发送，请查收邮箱');toast('请在此设备的浏览器中打开邮件里的登录链接')}catch(e){status('发送失败：'+e.message)}finally{button.disabled=false}}

function authScreen(){const logged=!!activeUser;$('#nav').innerHTML='';$('#main').innerHTML=`<header><div><div class="eyebrow">LINUC / PRIVATE CLOUD</div><h1>你的学习资料，随时回来复习。</h1></div></header><section class="panel" style="max-width:600px"><h2>${logged?'正在连接你的云端资料':'登录个人学习空间'}</h2><p>笔记、错题、截图与复习进度保存在云端。不同设备使用同一邮箱登录，即可读取同一份资料。</p><p id="cloudStatus" class="notice" role="status">${esc(cloudStatus)}</p>${logged?'<button onclick="loadCloud()">重新读取云端资料</button><button onclick="logout()">退出登录</button>':`<form onsubmit="login(event)"><label>邮箱<input name="email" type="email" required autocomplete="email" placeholder="输入你的邮箱"></label><button class="primary" type="submit" ${db?'':'disabled'}>发送登录链接</button></form><p class="muted">首次请使用 Supabase 组织账号所用的邮箱。免费默认邮件服务仅允许已授权的组织成员邮箱；登录链接会发送到该邮箱。</p>`}</section>`}
async function initCloud(){try{if(!window.supabase)throw Error('登录组件加载失败，请检查网络后刷新');db=window.supabase.createClient(CLOUD_URL,CLOUD_PUBLIC_KEY);db.auth.onAuthStateChange((event,session)=>{const user=session?.user||null;if(user?.id===activeUser?.id)return;activeUser=user;state={items:[]};quiz=[];ready=false;revision=0;pendingDraft=null;if($('#editor').open)$('#editor').close();cloudStatus=user?'正在读取云端资料…':'请先登录，资料仅向本人开放';render();if(user)setTimeout(()=>loadCloud(),0)});const {data,error}=await db.auth.getSession();if(error)throw error;if(data.session&&!activeUser){activeUser=data.session.user;await loadCloud()}else render()}catch(e){status('连接失败：'+e.message);render()}}
window.addEventListener('beforeunload',e=>{if(busy||pendingDraft||$('#editor').open){e.preventDefault();e.returnValue=''}});

function render(){ if(!ready){authScreen();return} $('#nav').innerHTML=Object.entries(names).map(([k,v])=>`<button class="${page===k?'active':''}" onclick="go('${k}')">${v}</button>`).join('');let body='';const due=state.items.filter(i=>i.due<=Date.now());if(page==='home'){body=`<section class="hero"><div><div class="eyebrow" style="color:#b4cf9a">YOUR LEARNING JOURNEY</div><h1>今天，再理解一个知识点。</h1><p>从疑惑到理解，从错题到掌握。建立属于你的 LinuC 知识库。</p></div><button class="primary" onclick="startQuiz(true)">开始今日复习 →</button></section><div class="stats"><div class="stat"><small>学习笔记</small><b>${state.items.filter(i=>i.type==='note').length}</b></div><div class="stat"><small>收录错题</small><b>${state.items.filter(i=>i.type==='error').length}</b></div><div class="stat"><small>待复习</small><b>${due.length}</b></div></div><div class="grid"><section class="panel"><h2>收集一个新的疑惑</h2><p class="muted">把 ChatGPT 讲解、命令用法或学习截图放进来。</p><button onclick="edit('note')">＋ 添加知识点</button></section><section class="panel"><h2>把错题变成进步</h2><p class="muted">记录自己的答案、正确答案与错因，之后反复练习。</p><button onclick="edit('error')">＋ 记录错题</button></section></div><h2 style="margin-top:30px">最近学习</h2>${state.items.slice().sort((a,b)=>b.updated-a.updated).slice(0,3).map(card).join('')||'<div class="empty">你的知识库还是空白的。添加第一条笔记，开始积累。</div>'}`}
if(page==='notes'||page==='errors'){body=`<div class="toolbar"><input type="search" placeholder="搜索标题、知识点、命令…" value="${esc(query)}" oninput="query=this.value;list()"><select onchange="filter=this.value;list()"><option value="all">全部范围</option><option>201</option><option>202</option><option>通用</option></select><button class="primary" onclick="edit('${page==='notes'?'note':'error'}')">＋ 新增${page==='notes'?'笔记':'错题'}</button></div><div id="list"></div>`}
if(page==='practice'){body=`<section class="panel"><h2>用主动回忆加深理解</h2><p class="muted">先尝试回答，再查看解析。根据你的掌握程度，安排下一次复习。</p><div class="actions"><button class="primary" onclick="startQuiz(true)">今日到期复习（${due.length}）</button><button onclick="startQuiz(false)">随机复习全部</button></div></section><div id="quiz"></div>`}
if(page==='backup'){body=`<div class="grid"><section class="panel"><h2>云端资料与独立备份</h2><p>资料已保存在你的云端账号。不同设备使用同一邮箱登录即可读取；建议定期导出一份独立备份。</p><div class="actions"><button class="primary" onclick="download()">导出完整备份</button><button onclick="$('#backupFile').click()">导入备份（合并）</button></div><div class="actions"><button onclick="migrateLocal()">迁移此浏览器的旧版资料</button><button onclick="downloadDraft()">导出未保存草稿</button></div><input hidden id="backupFile" type="file" accept="application/json" onchange="importBackup(this)"></section><section class="panel"><h2>免费配合 ChatGPT</h2><p>生成整理提示词 → 复制到你现有的 ChatGPT → 把结果导回。这里不会自动调用 AI 或读取聊天记录。</p><button onclick="promptAI()">生成整理与出题提示词</button></section></div><section class="panel" style="margin-top:20px"><h2>导入 AI 整理结果</h2><p class="muted">粘贴 ChatGPT 返回的 JSON。导入前请核对命令、答案和解析。</p><textarea id="aiJSON" placeholder='{"items": [...]}'></textarea><button class="primary" onclick="importAI()">导入笔记和习题</button></section><p class="muted">学习资料通过加密连接保存在 Supabase，并按账号隔离。GitHub 仅保存网站代码与公开连接配置。网页加载 Supabase 登录组件；不要把个人备份或服务端密钥提交到仓库。</p>`}
$('#main').innerHTML=`<header><div><div class="eyebrow">LINUX / LEVEL 2</div><h1>${names[page]}</h1><small>${new Date().toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric'})} · 持续学习，逐渐掌握</small></div><div class="actions"><button onclick="refreshCloud()">刷新云端</button><button onclick="logout()">退出</button><button onclick="edit('note')">＋ 记录</button></div></header><div class="notice" style="margin-bottom:20px"><span id="cloudStatus" role="status">${esc(cloudStatus)}</span> · ${esc(activeUser.email)}${pendingDraft?'<br>有未保存草稿，请前往“备份与 AI 助手”导出。':''}</div>${body}`;if(page==='notes'||page==='errors')list();}
function list(){const items=state.items.filter(i=>i.type===(page==='notes'?'note':'error')&&(filter==='all'||i.scope===filter)&&[i.title,i.content,i.tags,i.answer,i.reason].join(' ').toLowerCase().includes(query.toLowerCase()));$('#list').innerHTML=items.map(card).join('')||'<div class="empty">还没有匹配的记录。可以添加文字或学习截图。</div>'}
function card(i){return `<article class="card"><span class="tag">${esc(i.scope)}</span><span class="tag">${i.type==='error'?'错题':'笔记'}</span><small>${esc(i.tags)} · ${i.level===0?'待理解':i.level===1?'正在掌握':'已掌握'}</small><h3 style="margin-top:10px">${esc(i.title)}</h3><p>${esc(i.content.slice(0,160))}${i.content.length>160?'…':''}</p><small>下次复习 ${date(i.due)}</small><div class="actions"><button onclick="edit('', '${i.id}')">查看 / 编辑</button><button onclick="singleQuiz('${i.id}')">复习这条</button><button onclick="promptAI('${i.id}')">AI 整理 / 出题</button></div></article>`}
function edit(type,id){if(busy)return toast('正在保存，请稍候');const i=state.items.find(i=>i.id===id)||{type,title:'',scope:'201',tags:'',content:'',answer:'',mine:'',reason:'',image:''};$('#editor').innerHTML=`<form id="form"><h2>${id?'编辑记录':i.type==='error'?'记录一道错题':'添加学习笔记'}</h2><label>标题<input name="title" required value="${esc(i.title)}" placeholder="例如：systemd 单元依赖关系"></label><div class="grid"><label>范围<select name="scope">${['201','202','通用'].map(s=>`<option ${s===i.scope?'selected':''}>${s}</option>`).join('')}</select></label><label>知识点 / 标签<input name="tags" value="${esc(i.tags)}" placeholder="例如 systemd, 启动管理"></label></div><label>${i.type==='error'?'原题与选项':'知识点、原始资料或 ChatGPT 讲解'}</label><textarea name="content">${esc(i.content)}</textarea>${i.type==='error'?`<label>我的答案<input name="mine" value="${esc(i.mine)}"></label>`:''}<label>${i.type==='error'?'正确答案与解析':'复习答案 / 整理后的笔记'}</label><textarea name="answer">${esc(i.answer)}</textarea><label>疑惑 / 错因 / 关联知识点<textarea name="reason">${esc(i.reason)}</textarea></label><label>附加截图（单张，最大 2 MB）<input type="file" name="image" accept="image/png,image/jpeg,image/webp"></label>${i.image?`<img class="image" src="${safeImage(i.image)}" alt="学习截图"><label><input type="checkbox" name="removeImage"> 删除已有截图</label>`:''}<div class="actions"><button class="primary" type="submit">保存记录</button><button type="button" onclick="$('#editor').close()">取消</button>${id?`<button type="button" class="danger" onclick="removeItem('${id}')">删除</button>`:''}</div></form>`;$('#form').onsubmit=async e=>{e.preventDefault();if(busy)return toast('正在保存，请稍候');const f=new FormData(e.target),file=f.get('image');let img=f.get('removeImage')?'':i.image;if(file&&file.size){if(file.size>2*1024*1024)return alert('请使用小于 2 MB 的截图。');if(!/^image\/(png|jpeg|webp)$/.test(file.type))return alert('仅支持 PNG、JPEG 或 WebP 图片。');img=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})}const item={...i,id:id||crypto.randomUUID(),title:f.get('title').trim(),scope:f.get('scope'),tags:f.get('tags'),content:f.get('content'),answer:f.get('answer'),mine:f.get('mine')||'',reason:f.get('reason'),image:img,level:i.level||0,due:i.due||Date.now(),updated:Date.now()};const old=state.items.slice();state.items=id?state.items.map(x=>x.id===id?item:x):[item,...state.items];if(!await save()){state.items=old;return}$('#editor').close();render();toast('已保存到云端')};$('#editor').showModal()}
function safeImage(s){return /^data:image\/(png|jpeg|webp);base64,[A-Za-z0-9+/=]+$/.test(s||'')?s:''}
async function removeItem(id){if(busy)return toast('正在保存，请稍候');if(!confirm('删除这条记录？建议先导出备份。'))return;const old=state.items;state.items=state.items.filter(i=>i.id!==id);if(!await save()){state.items=old;return}$('#editor').close();render()}

function showQuiz(){revealed=false;const i=quiz[qi];$('#quiz').innerHTML=i?`<article class="card"><small>主动回忆 · ${qi+1} / ${quiz.length}</small><h2>${esc(i.title)}</h2><p style="white-space:pre-wrap">${esc(i.content)}</p>${safeImage(i.image)?`<img class="image" src="${safeImage(i.image)}" alt="原始截图">`:''}<textarea placeholder="先写下你的理解或答案（练习草稿不保存）"></textarea><div class="actions"><button class="primary" onclick="reveal()">查看答案与解析</button></div><div id="solution"></div></article>`:`<div class="empty">${quiz.length?'本轮复习完成，继续保持。':'暂无待复习记录。先添加笔记或错题，也可以选择随机复习全部。'}</div>`}
function reveal(){if(revealed)return;revealed=true;const i=quiz[qi];$('#solution').innerHTML=`<div class="answer" style="margin-top:18px">${esc(i.answer||'这条记录还没有答案，请回到记录中补充。')}${i.mine?'\n\n原来的答案：'+esc(i.mine):''}${i.reason?'\n\n疑惑 / 错因：'+esc(i.reason):''}</div><small>自评决定下次复习时间：未理解 1 天，模糊 3 天，掌握 7 天。</small><div class="actions"><button onclick="rate(0)">还没理解 · 1 天</button><button onclick="rate(1)">有点模糊 · 3 天</button><button class="primary" onclick="rate(2)">已掌握 · 7 天</button></div>`}
async function rate(level){if(busy)return toast('正在保存，请稍候');const i=quiz[qi],old={...i};i.level=level;i.due=Date.now()+[1,3,7][level]*86400000;i.updated=Date.now();if(!await save()){Object.assign(i,old);return}qi++;showQuiz()}
function download(){const b=new Blob([JSON.stringify({version:1,exported:new Date().toISOString(),items:state.items},null,2)],{type:'application/json'}),url=URL.createObjectURL(b),a=document.createElement('a');a.href=url;a.download='linuc-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function normalize(x){if(!x||typeof x!=='object'||typeof x.title!=='string'||!x.title.trim())throw Error('每条记录必须有标题');const str=k=>typeof x[k]==='string'?x[k]:'';return {id:typeof x.id==='string'&&/^[a-zA-Z0-9-]{1,80}$/.test(x.id)?x.id:crypto.randomUUID(),type:x.type==='error'?'error':'note',title:x.title,scope:['201','202','通用'].includes(x.scope)?x.scope:'通用',tags:str('tags'),content:str('content'),answer:str('answer'),mine:str('mine'),reason:str('reason'),image:safeImage(x.image),due:Number.isFinite(x.due)?x.due:Date.now(),updated:Number.isFinite(x.updated)?x.updated:Date.now(),level:[0,1,2].includes(x.level)?x.level:0}}
async function merge(data){if(busy)throw Error('正在保存，请稍候');if(!Array.isArray(data.items)||data.items.length>10000)throw Error('需要包含 items 数组，最多 10000 条');const items=data.items.map(normalize),map=new Map(state.items.map(i=>[i.id,i]));for(const i of items){const old=map.get(i.id);if(!old||i.updated>=old.updated)map.set(i.id,i)}const old=state.items;state.items=[...map.values()];if(!await save()){state.items=old;return false}return true}
async function importBackup(input){try{const f=input.files[0];if(!f)return;if(f.size>30*1024*1024)throw Error('备份大于 30 MB');if(await merge(JSON.parse(await f.text()))){render();toast('备份已合并，同 ID 保留较新记录')}}catch(e){alert('导入失败：'+e.message)}input.value=''}
async function importAI(){try{const raw=$('#aiJSON').value.trim().replace(/^```(?:json)?\s*/,'').replace(/\s*```$/,'');if(await merge(JSON.parse(raw))){render();toast('AI 整理结果已导入')}}catch(e){alert('导入失败：'+e.message)}}
function promptAI(id){const i=state.items.find(x=>x.id===id);const prompt=`请作为我的 LinuC Level 2 学习助手，整理下方资料，保留原意，核对 Linux 命令与参数，说明版本或发行版差异，不确定之处明确标注。生成一条结构清楚的学习笔记（核心概念、示例、易混点），以及 3 道原创相关练习（题干包含完整选项，答案给出解释）。标注原有错因与相关知识点。不要声称这些是官方真题。只输出可解析的 JSON，格式为 {"items":[{"type":"note 或 error","title":"标题","scope":"201 或 202 或 通用","tags":"知识点，用逗号分隔","content":"原始知识点或完整题干与选项","answer":"整理后的笔记或正确答案与解析","mine":"我的原答案，没有则空字符串","reason":"疑惑或错因"}]}。不得包含 Markdown 代码围栏。\n\n资料：\n${i?JSON.stringify({title:i.title,scope:i.scope,content:i.content,answer:i.answer,mine:i.mine,reason:i.reason}):'【请在这里粘贴要学习的内容、错题，或附上截图】'}`;$('#editor').innerHTML=`<h2>复制到 ChatGPT</h2><p class="muted">在你现有的 ChatGPT 对话里发送；返回的 JSON 可在“备份与 AI 助手”导入。附图需要在 ChatGPT 中另行上传。</p><textarea id="promptText" style="min-height:280px">${esc(prompt)}</textarea><div class="actions"><button class="primary" onclick="copyPrompt()">复制提示词</button><button onclick="$('#editor').close()">关闭</button></div>`;$('#editor').showModal()}
async function copyPrompt(){try{await navigator.clipboard.writeText($('#promptText').value);toast('已复制')}catch(e){$('#promptText').select();toast('请按 Ctrl+C 或 Command+C 复制')}}

function downloadDraft(){if(!pendingDraft)return toast('没有未保存草稿');exportJSON(pendingDraft,'linuc-unsaved-draft')}
function exportJSON(data,name){const blob=new Blob([JSON.stringify({version:2,exported:new Date().toISOString(),...data},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name+'-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function migrateLocal(){try{const raw=localStorage.getItem(KEY);if(!raw)return toast('此浏览器没有旧版资料，可导入以前导出的备份');const data=JSON.parse(raw);if(!data.items?.length)return toast('旧版资料为空');if(!confirm('把此浏览器的 '+data.items.length+' 条旧版资料合并保存到你的云端账号？原本地资料会保留。'))return;if(await merge(data)){render();toast('旧版资料已迁移到云端')}}catch(e){alert('迁移失败：'+e.message)}}
render();initCloud();
</script></html>
